[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vehicledet"
version = "0.1.0"
description = "Military & civilian vehicle detection (6 classes) with Ultralytics YOLO"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ruff.lint.per-file-ignores]
# Các file này chứa chuỗi mẫu báo cáo tiếng Việt dài
"src/vehicledet/data/commands.py" = ["E501"]
"src/vehicledet/error_analysis.py" = ["E501"]
