# Thí nghiệm 4 – imgsz 960 cho model tốt nhất ở 3 (mặc định yolo11s; nếu model khác thắng: --override model=<w>.pt --override name=<tên>). batch 8 để vừa 8 GB VRAM (chưa kiểm chứng, giảm tiếp nếu OOM).
model: yolo11s.pt
split: v2
seed: 0
project: runs/detect   # tương đối so với gốc repo (được .gitignore)
name: exp4_yolo11s_v2_960
train:
  epochs: 15           # tối đa 15 (laptop: giảm tải nhiệt); early stopping dừng sớm nếu val không cải thiện
  patience: 8
  close_mosaic: 5      # tắt mosaic ở 5 epoch cuối (mặc định 10 sẽ tắt gần hết nửa sau của 15 epoch)
  imgsz: 960
  batch: 8            # 8 GB VRAM
  workers: 4
  deterministic: true
  plots: true
