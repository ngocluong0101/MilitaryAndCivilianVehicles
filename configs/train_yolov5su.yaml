# Baseline: YOLOv5s anchor-free của ultralytics (yolov5su), imgsz 640.
# Lưu ý: khác YOLOv5 gốc (head anchor-free, loss mới) -> không so sánh trực tiếp với mã YOLOv5 cũ.
model: yolov5su.pt
split: legacy          # tên thư mục trong splits/
seed: 0
project: runs/detect   # tương đối so với gốc repo
name: yolov5su_legacy_640
train:
  epochs: 100
  patience: 20         # early stopping
  imgsz: 640
  batch: 16            # 8 GB VRAM: giảm xuống 8 nếu OOM
  workers: 4
  deterministic: true
  cos_lr: false
  plots: true
