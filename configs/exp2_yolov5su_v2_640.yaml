# Thí nghiệm 2 – cùng baseline trên cách chia MỚI (không rò rỉ). Chỉ đổi split so với exp1.
model: yolov5su.pt
split: v2
seed: 0
project: runs/detect   # tương đối so với gốc repo (được .gitignore)
name: exp2_yolov5su_v2_640
train:
  epochs: 20           # tối đa 20 theo yêu cầu; early stopping dừng sớm nếu val không cải thiện
  patience: 10
  imgsz: 640
  batch: 16            # 8 GB VRAM
  workers: 4
  deterministic: true
  plots: true
