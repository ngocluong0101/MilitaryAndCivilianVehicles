name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # CPU thuần: không cài torch/ultralytics, không cần dataset hay GPU (test dùng dữ liệu giả)
      - name: Install dependencies
        run: |
          grep -vE '^(torch|torchvision|ultralytics)==' requirements.txt | python -m pip install -r /dev/stdin
          python -m pip install --no-deps -e .

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (format)
        run: ruff format --check .

      - name: Pytest
        run: pytest
